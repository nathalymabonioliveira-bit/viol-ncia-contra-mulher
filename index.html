<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Visconde - Visconde Alerta: Voz que Acolhe</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --rosa-ameixa: #873260;
            --rosa-claro: #fdf2f8;
            --texto-escuro: #2d1a24;
            --branco: #ffffff;
            --cinza-uniforme: #8a8a8a;
            --azul-visconde: #1d4ed8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--rosa-claro);
            color: var(--texto-escuro);
            line-height: 1.6;
            user-select: none;
        }

        header {
            background-color: var(--rosa-ameixa);
            color: var(--branco);
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        header h1 { font-size: 2rem; margin-bottom: 0.5rem; }

        nav {
            background: #4a1b33;
            padding: 0.8rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        nav a:hover { color: #ffb7d5; }

        .container { max-width: 1000px; margin: 1.5rem auto; padding: 0 15px; }

        section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        h2 { color: var(--rosa-ameixa); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }

        /* Estilo do Novo Jogo RPG Top-Down */
        #game-wrapper {
            background: #1e293b;
            border: 4px solid var(--rosa-ameixa);
            border-radius: 12px;
            padding: 10px;
            max-width: 820px;
            margin: 0 auto;
            position: relative;
        }

        .game-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-family: 'Press Start 2P', cursive;
            font-size: 11px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .bar-container {
            width: 150px;
            height: 14px;
            background: #475569;
            border-radius: 7px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            border: 1px solid #ffffff;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: #22c55e;
            transition: width 0.3s;
        }

        #gameCanvas {
            background: #cbd5e1;
            display: block;
            width: 100%;
            max-width: 800px;
            height: auto;
            aspect-ratio: 4 / 3;
            border-radius: 8px;
            cursor: pointer;
            image-rendering: pixelated;
        }

        /* Controles Virtuais para Celular */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 50px);
            gap: 5px;
            justify-content: center;
            margin-top: 15px;
        }

        .btn-touch {
            background: var(--rosa-ameixa);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #4a1b33;
        }

        .btn-touch:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #4a1b33;
        }

        /* Modal de Diálogo e Decisões */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
