<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Visconde - Dignidade, Proteção e Denúncia</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --rosa-ameixa: #873260;
            --rosa-neon: #ff4081;
            --roxo-fundo: #0d060d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 64, 129, 0.2);
            --texto-claro: #f8fafc;
            --texto-mutado: #cbd5e1;
            --verde-sucesso: #10b981;
            --vermelho-alerta: #ef4444;
            --amarelo-alerta: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--roxo-fundo);
            color: var(--texto-claro);
            line-height: 1.6;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(135, 50, 96, 0.15) 0%, transparent 80%);
            z-index: -1;
        }

        .emergency-bar {
            background: var(--vermelho-alerta);
            color: white;
            text-align: center;
            padding: 15px;
            font-weight: 800;
            position: sticky;
            top: 0;
            z-index: 9999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        header {
            text-align: center;
            padding: 4rem 1rem 3rem;
            background: linear-gradient(to bottom, #1a0a1a, var(--roxo-fundo));
        }

        .badge {
            background: rgba(255, 64, 129, 0.1);
            border: 1px solid var(--rosa-neon);
            color: var(--rosa-neon);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 1rem;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #ff80ab 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        header p {
            max-width: 700px;
            margin: 0 auto;
            color: var(--texto-mutado);
            font-size: 1.1rem;
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        section { margin-bottom: 4rem; animation: fadeIn 1s ease-in; }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            color: var(--rosa-neon);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-title::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: var(--card-border);
        }

        /* Grids de Informação */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 2rem;
            border-radius: 20px;
            transition: 0.3s;
        }

        .info-card:hover { 
            transform: translateY(-5px); 
            background: rgba(255, 255, 255, 0.08); 
        }

        .info-card h3 {
            color: var(--rosa-neon);
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        /*
