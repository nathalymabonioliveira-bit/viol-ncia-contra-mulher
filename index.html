<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Visconde - Conscientização & Apoio</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --rosa-ameixa: #873260;
            --rosa-neon: #ff4081;
            --roxo-fundo: #120813;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 64, 129, 0.2);
            --texto-claro: #f8fafc;
            --texto-mutado: #cbd5e1;
            --verde-sucesso: #10b981;
            --vermelho-alerta: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--roxo-fundo);
            color: var(--texto-claro);
            line-height: 1.6;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* Fundo com efeito dinâmico */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(135, 50, 96, 0.25) 0%, transparent 60%);
            z-index: -1;
        }

        /* Header / Hero Section */
        header {
            text-align: center;
            padding: 3rem 1.5rem 2rem;
            position: relative;
        }

        .badge-escola {
            background: rgba(135, 50, 96, 0.3);
            border: 1px solid var(--rosa-neon);
            color: var(--rosa-neon);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 1rem;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #ff80ab 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--texto-mutado);
            max-width: 600px;
            margin: 0 auto;
            font-size: 1.1rem;
        }

        /* Dashboard de Conscientização */
        .status-tracker {
            max-width: 900px;
            margin: 1.5rem auto 2.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.2rem 2rem;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .tracker-info span {
            font-size: 0.9rem;
            color: var(--texto-mutado);
        }

        .tracker-info h3 {
            font-size: 1.4rem;
            color: var(--rosa-neon);
        }

        .progress-bar-bg {
            width: 200px;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #global-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--rosa-ameixa), var(--rosa-neon));
            transition: width 0.5s ease;
        }

        /* Container de Seções */
        .container {
            max-width: 950px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::before {
            content: '';
            width: 8px;
            height: 28px;
            background: var(--rosa-neon);
            border-radius: 4px;
        }

        /* Cards Informativos - Guarapuava */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 3rem;
        }

        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            transition: transform 0.3s, border-color 0.3s;
        }

        .info-card:hover {
            transform: translateY(-5px);
            border-color: var(--rosa-neon);
        }

        .info-card h3 {
            color: var(--rosa-neon);
            font-size: 1.2rem;
            margin-bottom: 0.8rem;
        }

        .info-card p {
            color: var(--texto-mutado);
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .tag-local {
            background: rgba(255, 64, 129, 0.15);
            color: #ff80ab;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            display: inline-block;
        }

        /* Mini-Game Section */
        .game-section {
            background: rgba(18, 8, 19, 0.8);
            border: 2px solid var(--rosa-ameixa);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 3rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            position: relative;
        }

        #game-wrapper {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        #hud {
            background: #1e101f;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65rem;
            border-bottom: 2px solid var(--rosa-ameixa);
            flex-wrap: wrap;
            gap: 10px;
        }

        #apoio-bar-bg {
            width: 100px;
            height: 10px;
            background: #333;
            border-radius: 5px;
            display: inline-block;
            overflow: hidden;
            vertical-align: middle;
        }

        #apoio-bar-fill {
            width: 20%;
            height: 100%;
            background: var(--verde-sucesso);
            transition: width 0.3s;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
        }

        #dialog-box {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            background: rgba(20, 10, 22, 0.95);
            border: 2px solid var(--rosa-neon);
            border-radius: 10px;
            padding: 15px;
            display: none;
            z-index: 10;
        }

        #dialog-title {
            color: var(--rosa-neon);
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 6px;
        }

        #dialog-text {
            font-size: 0.9rem;
            color: var(--texto-claro);
            margin-bottom: 12px;
        }

        .game-choice-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 64, 129, 0.3);
            color: var(--texto-claro);
            padding: 10px;
            border-radius: 6px;
            text-align: left;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            margin-bottom: 6px;
            transition: 0.2s;
        }

        .game-choice-btn:hover {
            background: var(--rosa-ameixa);
            border-color: var(--rosa-neon);
        }

        /* Controles Virtuais */
        #mobile-controls {
            display: grid;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(2, 50px);
            gap: 6px;
            margin: 15px auto 0;
            justify-content: center;
        }

        .dpad-btn {
            background: var(--rosa-ameixa);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 0 #4a1b33;
            cursor: pointer;
        }

        .dpad-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #4a1b33;
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        /* Quizzes Interativos */
        .quiz-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .quiz-card p {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .quiz-opt {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--texto-claro);
            padding: 12px 16px;
            border-radius: 10px;
            text-align: left;
            font-size: 0.95rem;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Outfit', sans-serif;
        }

        .quiz-opt:hover {
            background: rgba(255, 64, 129, 0.15);
            border-color: var(--rosa-neon);
        }

        .quiz-feedback {
            margin-top: 10px;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            font-weight: 600;
        }

        /* Canais de Emergência */
        .help-banner {
            background: linear-gradient(135deg, var(--rosa-ameixa) 0%, #4a1a37 100%);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            border: 1px solid var(--rosa-neon);
        }

        .help-banner h2 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        .help-banner p { color: var(--texto-mutado); margin-bottom: 1.5rem; }

        .btn-call {
            display: inline-block;
            background: var(--rosa-neon);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            margin: 5px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4)
        }
